    <!-- ── Professional Loader Styles ─────────────────────────────── -->
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      /* Loader Container */
      #loader {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: #F7F8FA;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.4s ease-out, visibility 0.4s ease-out;
      }

      #loader.fade-out {
        opacity: 0;
        visibility: hidden;
      }

      /* Loader Content */
      .loader-content {
        text-align: center;
        animation: fadeInUp 0.6s ease-out;
      }

      /* Logo Animation */
      .loader-logo {
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .loader-logo-circle {
        position: relative;
        width: 96px;
        height: 96px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .loader-logo-circle::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        border-radius: 50%;
        border: 3px solid rgba(11, 29, 58, 0.08);
        border-top-color: #C8A84B;
        border-right-color: #C8A84B;
        animation: spinRing 1s linear infinite;
      }

      .loader-logo-inner {
        width: 72px;
        height: 72px;
        border-radius: 50%;
        background: #FFFFFF;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 4px 20px rgba(11, 29, 58, 0.08), 0 0 0 1px rgba(11, 29, 58, 0.06);
        overflow: hidden;
      }

      .loader-logo-inner img {
        width: 56px;
        height: 56px;
        object-fit: contain;
        border-radius: 50%;
      }

      /* Animations */
      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes spinRing {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      /* Hide loader when React is ready */
      #root {
        min-height: 100vh;
        opacity: 0;
        transition: opacity 0.3s ease-out;
      }

      #root.loaded {
        opacity: 1;
      }

      /* Prevent scroll during loading */
      body.loading {
        overflow: hidden;
      }
    </style>

  <body class="loading">
    <!-- Professional Loader -->
    <div id="loader">
      <div class="loader-content">
        <div class="loader-logo">
          <div class="loader-logo-circle">
            <div class="loader-logo-inner">

    </div>

    <!-- React App -->
    <div id="root"></div>

    <script>
      // Remove loader when page is fully loaded
      window.addEventListener('load', () => {
        setTimeout(() => {
          const loader = document.getElementById('loader');
          if (loader) {
            loader.classList.add('fade-out');
            setTimeout(() => {
              loader.remove();
              document.body.classList.remove('loading');
              
              // Fade in the React app
              const root = document.getElementById('root');
              if (root) {
                root.classList.add('loaded');
              }
            }, 400);
          }
        }, 800);
      });

      // Fallback: Remove loader after 5 seconds max
      setTimeout(() => {
        const loader = document.getElementById('loader');
        if (loader && loader.parentNode) {
          loader.remove();
          document.body.classList.remove('loading');
          const root = document.getElementById('root');
          if (root) root.classList.add('loaded');
        }
      }, 5000);
    </script>
