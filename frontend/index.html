<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- ── Primary Meta Tags ─────────────────────────────── -->
    <title>NairobiJetHouse | Private Jet Charter & Luxury Travel Worldwide</title>
    <meta name="title" content="NairobiJetHouse | Private Jet Charter, Helicopter Hire & Yacht Charter Worldwide" />
    <meta name="description" content="NairobiJetHouse — premier private aviation company offering jets, helicopters, yachts, air cargo and luxury travel worldwide from Nairobi, Kenya." />
    <meta name="author" content="NairobiJetHouse" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#0B1D3A" />

    <!-- ── Open Graph ─────────────────────────────── -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="NairobiJetHouse | Private Aviation & Luxury Charter" />
    <meta property="og:description" content="Private jets, helicopters, yachts, and global air cargo services from Kenya to the world." />
    <meta property="og:image" content="/nairobijethouse.png" />
    <meta property="og:url" content="https://www.nairobijethouse.com/" />

    <!-- ── Twitter Card ─────────────────────────────── -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="NairobiJetHouse | Luxury Aviation Worldwide" />
    <meta name="twitter:description" content="Private jets, helicopters, yachts & air cargo services." />
    <meta name="twitter:image" content="/nairobijethouse.png" />

    <!-- ── Favicon ─────────────────────────────── -->
    <link rel="icon" type="image/png" href="/nairobijethouse.png" />
    <link rel="apple-touch-icon" href="/nairobijethouse.png" />

    <!-- ── Preconnect for Performance ─────────────────────────────── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />

    <!-- ── Fonts (Professional & Clean) ─────────────────────────────── -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&family=Playfair+Display:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    

    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />

    <!-- ── Professional Loader Styles ─────────────────────────────── -->
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      /* Loader Container */
      #loader {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: #F7F8FA;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.4s ease-out, visibility 0.4s ease-out;
      }

      #loader.fade-out {
        opacity: 0;
        visibility: hidden;
      }

      /* Loader Content */
      .loader-content {
        text-align: center;
        animation: fadeInUp 0.6s ease-out;
      }

      /* Logo Animation */
      .loader-logo {
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .loader-logo-circle {
        position: relative;
        width: 96px;
        height: 96px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .loader-logo-circle::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        border-radius: 50%;
        border: 3px solid rgba(11, 29, 58, 0.08);
        border-top-color: #C8A84B;
        border-right-color: #C8A84B;
        animation: spinRing 1s linear infinite;
      }

      .loader-logo-inner {
        width: 72px;
        height: 72px;
        border-radius: 50%;
        background: #FFFFFF;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 4px 20px rgba(11, 29, 58, 0.08), 0 0 0 1px rgba(11, 29, 58, 0.06);
        overflow: hidden;
      }

      .loader-logo-inner img {
        width: 56px;
        height: 56px;
        object-fit: contain;
        border-radius: 50%;
      }

      /* Animations */
      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes spinRing {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      /* Hide loader when React is ready */
      #root {
        min-height: 100vh;
        opacity: 0;
        transition: opacity 0.3s ease-out;
      }

      #root.loaded {
        opacity: 1;
      }

      /* Prevent scroll during loading */
      body.loading {
        overflow: hidden;
      }
    </style>
  </head>

  <body class="loading">
    <!-- Professional Loader -->
    <div id="loader">
      <div class="loader-content">
        <div class="loader-logo">
          <div class="loader-logo-circle">
            <div class="loader-logo-inner">
              <img src="/nairobijethouse.png" alt="NairobiJetHouse" />
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- React App -->
    <div id="root"></div>

    <script>
      // Remove loader when page is fully loaded
      window.addEventListener('load', () => {
        setTimeout(() => {
          const loader = document.getElementById('loader');
          if (loader) {
            loader.classList.add('fade-out');
            setTimeout(() => {
              loader.remove();
              document.body.classList.remove('loading');
              
              // Fade in the React app
              const root = document.getElementById('root');
              if (root) {
                root.classList.add('loaded');
              }
            }, 400);
          }
        }, 800);
      });

      // Fallback: Remove loader after 5 seconds max
      setTimeout(() => {
        const loader = document.getElementById('loader');
        if (loader && loader.parentNode) {
          loader.remove();
          document.body.classList.remove('loading');
          const root = document.getElementById('root');
          if (root) root.classList.add('loaded');
        }
      }, 5000);
    </script>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
