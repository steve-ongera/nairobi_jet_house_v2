<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ── Primary Meta Tags ─────────────────────────────── -->
    <title>NairobiJetHouse | Private Jet Charter, Helicopter Hire & Yacht Charter Worldwide</title>
    <meta name="title" content="NairobiJetHouse | Private Jet Charter, Helicopter Hire & Yacht Charter Worldwide" />
    <meta name="description" content="NairobiJetHouse — premier private aviation company offering jets, helicopters, yachts, air cargo and luxury travel worldwide from Nairobi, Kenya." />
    <meta name="author" content="NairobiJetHouse" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#0B1D3A" />

    <!-- ── Open Graph ─────────────────────────────── -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="NairobiJetHouse | Private Aviation & Luxury Charter" />
    <meta property="og:description" content="Private jets, helicopters, yachts, and global air cargo services from Kenya to the world." />
    <meta property="og:image" content="/nairobijethouse.png" />
    <meta property="og:url" content="https://www.nairobijethouse.com/" />

    <!-- ── Twitter Card ─────────────────────────────── -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="NairobiJetHouse | Luxury Aviation Worldwide" />
    <meta name="twitter:description" content="Private jets, helicopters, yachts & air cargo services." />
    <meta name="twitter:image" content="/nairobijethouse.png" />

    <!-- ── Favicon ─────────────────────────────── -->
    <link rel="icon" type="image/png" href="/nairobijethouse.png" />
    <link rel="apple-touch-icon" href="/nairobijethouse.png" />

    <!-- ── ✨ IMPROVED FONTS (LUXURY AVIATION STYLE) ─────────────────────────────── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />

    <!-- ── ✨ MODERN LUXURY STYLING ─────────────────────────────── -->
    <style>
      :root {
        --navy: #0b1d3a;
        --navy-dark: #071428;
        --gold: #c8a84b;
        --white: #ffffff;
        --gray: #8fa3b8;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Inter", sans-serif;
        background: var(--white);
        color: var(--navy-dark);
        -webkit-font-smoothing: antialiased;
      }

      /* ── Top Bar ── */
      #topbar {
        background: var(--navy-dark);
        color: var(--gray);
        font-size: 12px;
        padding: 8px 0;
        border-bottom: 2px solid var(--gold);
      }

      #topbar .wrap {
        max-width: 1200px;
        margin: auto;
        display: flex;
        justify-content: space-between;
        padding: 0 20px;
      }

      /* ── Logo Style (optional if used in loader) ── */
      .logo {
        font-family: "Playfair Display", serif;
        font-size: 22px;
        color: var(--white);
        letter-spacing: 1px;
      }

      .logo span {
        color: var(--gold);
      }

      /* ── Loader ── */
      #loader {
        position: fixed;
        inset: 0;
        background: var(--navy);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
      }

      #loader h1 {
        font-family: "Playfair Display", serif;
        color: var(--white);
        font-size: 28px;
        letter-spacing: 1px;
      }

      #loader h1 span {
        color: var(--gold);
      }

      .loader-bar {
        width: 220px;
        height: 3px;
        background: rgba(255,255,255,0.2);
        margin-top: 16px;
        overflow: hidden;
        border-radius: 10px;
      }

      .loader-bar::after {
        content: "";
        display: block;
        height: 100%;
        width: 100%;
        background: var(--gold);
        animation: load 1.2s ease forwards;
      }

      @keyframes load {
        from { transform: translateX(-100%); }
        to { transform: translateX(0); }
      }

      /* ── Root ── */
      #root {
        min-height: 100vh;
      }
    </style>
  </head>

  <body>

   

    <!-- Loader -->
    <div id="loader">
      <h1>Nairobi<span>JetHouse</span></h1>
      <div class="loader-bar"></div>
    </div>

    <!-- React App -->
    <div id="root"></div>

    <script>
      window.addEventListener("load", () => {
        setTimeout(() => {
          document.getElementById("loader")?.remove();
        }, 1200);
      });
    </script>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
